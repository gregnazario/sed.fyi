<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="orb1" cx="360" cy="190" r="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="840" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d946ef" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#d946ef" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Title -->
  <text x="600" y="275" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="96" font-weight="700" text-anchor="middle" letter-spacing="-2" fill="white">sed.fyi</text>

  <!-- Tagline -->
  <text x="600" y="345" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" text-anchor="middle" fill="#a1a1aa">Open-source development tools for the modern web</text>

  <!-- Bottom gradient accent line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent)" opacity="0.5"/>
</svg>
