<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#09090b"/>
      <stop offset="1" stop-color="#18181b"/>
    </linearGradient>
    <radialGradient id="orb1" cx="360" cy="190" r="480" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ee5b1e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ee5b1e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="840" cy="380" r="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f59e0b" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ee5b1e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#orb1)"/>
  <rect width="1200" height="630" fill="url(#orb2)"/>

  <!-- Red Panda Mascot (right side) -->
  <g transform="translate(820, 120) scale(1.8)">
    <!-- Tail (behind body) -->
    <path d="M60 175 Q30 170 20 145 Q10 120 25 105 Q35 95 45 105 Q55 115 50 135 Q48 155 65 165" fill="#ee5b1e"/>
    <path d="M30 148 Q22 140 26 130" stroke="#401008" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M25 125 Q20 118 24 110" stroke="#401008" stroke-width="6" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="100" cy="170" rx="40" ry="35" fill="#ee5b1e"/>
    <ellipse cx="100" cy="175" rx="28" ry="24" fill="#fde4d4"/>

    <!-- Feet -->
    <ellipse cx="80" cy="200" rx="14" ry="8" fill="#401008"/>
    <ellipse cx="120" cy="200" rx="14" ry="8" fill="#401008"/>

    <!-- Left arm -->
    <path d="M65 160 Q50 170 52 180 Q54 188 62 185 Q68 178 70 168" fill="#ee5b1e"/>
    <ellipse cx="55" cy="183" rx="6" ry="5" fill="#401008"/>

    <!-- Right arm (waving) -->
    <path d="M135 160 Q155 140 160 120 Q163 108 155 105 Q147 108 145 118 Q140 135 130 150" fill="#ee5b1e"/>
    <ellipse cx="157" cy="108" rx="6" ry="5" fill="#401008" transform="rotate(-20 157 108)"/>

    <!-- Head -->
    <circle cx="100" cy="110" r="42" fill="#ee5b1e"/>
    <ellipse cx="100" cy="118" rx="32" ry="30" fill="#fde4d4"/>

    <!-- Ears -->
    <circle cx="68" cy="76" r="16" fill="#ee5b1e"/>
    <circle cx="132" cy="76" r="16" fill="#ee5b1e"/>
    <circle cx="68" cy="76" r="9" fill="#401008"/>
    <circle cx="132" cy="76" r="9" fill="#401008"/>
    <circle cx="68" cy="74" r="5" fill="#b93210"/>
    <circle cx="132" cy="74" r="5" fill="#b93210"/>

    <!-- Eye patches -->
    <ellipse cx="84" cy="108" rx="12" ry="13" fill="#b93210"/>
    <ellipse cx="116" cy="108" rx="12" ry="13" fill="#b93210"/>

    <!-- Eyes -->
    <circle cx="84" cy="108" r="6" fill="#401008"/>
    <circle cx="116" cy="108" r="6" fill="#401008"/>
    <circle cx="86.5" cy="106" r="2.5" fill="white"/>
    <circle cx="118.5" cy="106" r="2.5" fill="white"/>

    <!-- Nose -->
    <ellipse cx="100" cy="122" rx="5" ry="3.5" fill="#401008"/>

    <!-- Mouth -->
    <path d="M93 127 Q100 133 107 127" stroke="#401008" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Forehead stripe -->
    <path d="M88 94 Q100 86 112 94" stroke="#b93210" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <ellipse cx="74" cy="118" rx="6" ry="4" fill="#f6a070" opacity="0.5"/>
    <ellipse cx="126" cy="118" rx="6" ry="4" fill="#f6a070" opacity="0.5"/>
  </g>

  <!-- Title -->
  <text x="120" y="275" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="96" font-weight="700" letter-spacing="-2" fill="white">sed.fyi</text>

  <!-- Tagline -->
  <text x="120" y="345" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#a1a1aa">Open-source development tools for the modern web</text>

  <!-- Bottom gradient accent line -->
  <rect x="0" y="622" width="1200" height="8" fill="url(#accent)" opacity="0.5"/>
</svg>
